# Install as /etc/systemd/journald.conf.d/cannvas.conf
# Keep the persistent journal small on the SD card.
[Journal]
# Keep logs across reboots: diagnosing the nightly shutdown depends on reading
# the previous boot. The Cannvas Pi's older bookworm image already persists
# them. Newer Raspberry Pi OS images default to Storage=volatile to save SD
# writes, and this line overrides that. The limits below cap the cost, and
# they only apply to a persistent journal.
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=2G
SystemMaxFileSize=25M
RuntimeMaxUse=50M
MaxRetentionSec=1month
# Flush to disk every 10 minutes instead of 5. Critical messages are still
# synced at once, and a clean shutdown flushes everything.
SyncIntervalSec=10m
