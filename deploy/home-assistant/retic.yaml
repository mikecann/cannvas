# Home Assistant package for the Holman WX8 retic behind the Cannvas Retic app.
# Copy to /config/packages/retic.yaml. configuration.yaml needs:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# The zone valves come from tuya-local. Everything else is here.

input_boolean:
  # The master switch. Off stops any run, closes every zone, closes any zone
  # opened elsewhere (controller, Smart Life) and skips the schedule.
  retic_enabled:
    name: Retic enabled
    icon: mdi:sprinkler-variant

input_datetime:
  # When the current timed run ends, for the Cannvas countdown.
  retic_run_ends:
    name: Retic run ends
    has_date: true
    has_time: true

input_text:
  retic_last_result:
    name: Retic last scheduled run
    max: 255
  # Zones queued by hand in Cannvas, in order, like
  # "valve.retic_back_grass_right:15,valve.retic_front_grass:5". The first one
  # is watering while script.retic_run_queue is on. It starts empty after a
  # restart, because the runner doesn't survive one.
  retic_queue:
    name: Retic queue
    max: 255
    initial: ""
  # The schedule's start time and zones in order, set from Cannvas, like
  # "06:00;valve.retic_back_grass_right:15,valve.retic_front_grass:10". No
  # initial, so it keeps its value across restarts. Empty or unreadable parts
  # fall back to the defaults in the Retic next run sensor below.
  retic_schedule:
    name: Retic schedule
    max: 255

# Weather from Open-Meteo, which needs no key: hourly rain from a day ago to a
# day and a half ahead, and each day's rain and evaporation (FAO ET0) for the
# last two weeks and the next few days. Each hourly value is the rain in the
# hour before that time. The URL, with the home location rounded to two
# decimal places (about 1 km), is in secrets.yaml. In secrets.yaml, with your
# own rounded coordinates:
#
#   retic_open_meteo_url: "https://api.open-meteo.com/v1/forecast?latitude=-31.95&longitude=115.86&hourly=precipitation&daily=precipitation_sum,et0_fao_evapotranspiration&past_days=14&forecast_days=3&past_hours=24&forecast_hours=36&timezone=Australia%2FPerth"
#
# A fetch now and then times out (16 hours of them on 17-18 Nov 2026, which
# skipped that morning's watering for want of rain data), so the raw fetch is
# only copied into sensor.retic_weather when it worked, and everything reads
# that. Readings stay usable for 6 hours after the last good fetch.
rest:
  - resource: !secret retic_open_meteo_url
    scan_interval: 1800
    timeout: 30
    sensor:
      - name: Retic weather fetch
        unique_id: retic_weather_fetch
        icon: mdi:cloud-download
        value_template: >-
          {{ now().isoformat() if value_json.hourly is defined and value_json.daily is defined else none }}
        json_attributes:
          - hourly
          - daily

template:
  # The last good fetch, kept across restarts. Its state is when it was fetched.
  - triggers:
      - trigger: state
        entity_id: sensor.retic_weather_fetch
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
             and as_datetime(trigger.to_state.state, none) is not none
             and trigger.to_state.attributes.hourly is mapping
             and trigger.to_state.attributes.daily is mapping
             and trigger.to_state.attributes.hourly.time is defined
             and trigger.to_state.attributes.daily.et0_fao_evapotranspiration is defined }}
    sensor:
      - name: Retic weather
        unique_id: retic_weather
        icon: mdi:weather-rainy
        device_class: timestamp
        state: "{{ trigger.to_state.state }}"
        attributes:
          hourly: "{{ trigger.to_state.attributes.hourly }}"
          daily: "{{ trigger.to_state.attributes.daily }}"

  # Rain either side of now, from the last good fetch. Unavailable when that's
  # more than 6 hours old, and the schedule skips rather than guess.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: /5
      - trigger: state
        entity_id: sensor.retic_weather
    sensor:
      - name: Retic rain last 24h
        unique_id: retic_rain_last_24h_saved
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement
        availability: >
          {% set w = states.sensor.retic_weather %}
          {% set at = as_datetime(w.state, none) if w is not none else none %}
          {{ at is not none and now() - at < timedelta(hours=6)
             and w.attributes.hourly is mapping
             and now().strftime('%Y-%m-%dT%H:00') in w.attributes.hourly.time }}
        state: >
          {% set hourly = state_attr('sensor.retic_weather', 'hourly') %}
          {% set i = hourly.time.index(now().strftime('%Y-%m-%dT%H:00')) %}
          {{ hourly.precipitation[[i - 23, 0] | max:i + 1] | reject('none') | sum | round(1) }}
      - name: Retic rain next 12h
        unique_id: retic_rain_next_12h_saved
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement
        availability: >
          {% set w = states.sensor.retic_weather %}
          {% set at = as_datetime(w.state, none) if w is not none else none %}
          {{ at is not none and now() - at < timedelta(hours=6)
             and w.attributes.hourly is mapping
             and now().strftime('%Y-%m-%dT%H:00') in w.attributes.hourly.time }}
        state: >
          {% set hourly = state_attr('sensor.retic_weather', 'hourly') %}
          {% set i = hourly.time.index(now().strftime('%Y-%m-%dT%H:00')) %}
          {{ hourly.precipitation[i + 1:i + 13] | reject('none') | sum | round(1) }}

  # How dry each zone has got, in mm of water it's short. Each day the ground
  # loses that day's evaporation times the zone's crop factor, and gains the
  # rain. Watering a zone puts back its minutes times its sprinkler rate. It
  # never goes below 0 (the extra drains away) or above 40.
  #
  # The state is the last day counted. Just after midnight (or after a restart)
  # it counts every finished day since, from the saved daily weather, so a day
  # missed while Home Assistant was down still counts. A new sensor starts 4
  # days back, as if fully watered then.
  #
  # The crop factors and sprinkler rates are estimates. To measure a zone's
  # rate, put a few straight-sided tins on it, run it 15 minutes, and divide
  # the average depth of water in mm by 15.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time
        at: "00:10:00"
      - trigger: state
        entity_id: sensor.retic_weather
      - trigger: event
        event_type: retic_zone_watered
        id: watered
    variables:
      setup:
        valve.retic_back_grass_right: { crop: 0.7, rate: 0.6 }
        valve.retic_back_grass_left: { crop: 0.7, rate: 0.6 }
        valve.retic_back_flower_beds: { crop: 0.5, rate: 0.6 }
        valve.retic_front_garden_beds: { crop: 0.5, rate: 0.6 }
        valve.retic_front_grass: { crop: 0.7, rate: 0.6 }
      most_mm: 40
    sensor:
      - name: Retic dryness
        unique_id: retic_dryness
        icon: mdi:water-percent
        # The last day counted, like 2026-11-19.
        state: >
          {% set daily = state_attr('sensor.retic_weather', 'daily') %}
          {% set yesterday = (now().date() - timedelta(days=1)).isoformat() %}
          {% set old = this.state if this.state is match('[0-9]{4}-[0-9]{2}-[0-9]{2}$') else (now().date() - timedelta(days=5)).isoformat() %}
          {{ yesterday if daily is mapping and yesterday in daily.time and old < yesterday else old }}
        attributes:
          setup: "{{ setup }}"
          # Each zone's mm short.
          short: >
            {% set daily = state_attr('sensor.retic_weather', 'daily') %}
            {% set yesterday = (now().date() - timedelta(days=1)).isoformat() %}
            {% set old = this.state if this.state is match('[0-9]{4}-[0-9]{2}-[0-9]{2}$') else (now().date() - timedelta(days=5)).isoformat() %}
            {% set before = this.attributes.short if this.attributes.short is defined and this.attributes.short is mapping else {} %}
            {% set ns = namespace(out={}, mm=0) %}
            {% for zone, zone_setup in setup.items() %}
              {% set ns.mm = before[zone] | default(0) | float(0) %}
              {% if daily is mapping and old < yesterday %}
                {% for day in daily.time if day > old and day <= yesterday %}
                  {% set i = daily.time.index(day) %}
                  {% set lost = (daily.et0_fao_evapotranspiration[i] or 0) * zone_setup.crop %}
                  {% set ns.mm = [[ns.mm + lost - (daily.precipitation_sum[i] or 0), 0] | max, most_mm] | min %}
                {% endfor %}
              {% endif %}
              {% if trigger.id == 'watered' and trigger.event.data.zone == zone %}
                {% set ns.mm = [ns.mm - (trigger.event.data.minutes | float(0)) * zone_setup.rate, 0] | max %}
              {% endif %}
              {% set ns.out = dict(ns.out, **{zone: ns.mm | round(1)}) %}
            {% endfor %}
            {{ ns.out }}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: /5
      # A change from Cannvas, or a run logged, shows straight away.
      - trigger: state
        entity_id:
          - input_text.retic_schedule
          - sensor.retic_history
    # The schedule: from 1 September to 31 May, every few days at the start
    # time. The start time, the zones in order with their minutes, how many
    # days apart and whether amounts are automatic all come from
    # input_text.retic_schedule, which Cannvas sets.
    variables:
      off_months: [6, 7, 8]
      default_start: "06:00"
      default_zones: "valve.retic_back_grass_right:15,valve.retic_back_grass_left:15,valve.retic_back_flower_beds:10,valve.retic_front_garden_beds:10,valve.retic_front_grass:15"
      default_every: 2
      saved: "{{ states('input_text.retic_schedule') }}"
      parts: "{{ saved.split(';') if ';' in saved else [] }}"
      start: >-
        {% set text = parts[0] if parts | length > 0 else '' %}
        {{ text if text is match('([01][0-9]|2[0-3]):[0-5][0-9]$') else default_start }}
      # Each zone once, 1 to 15 minutes (the WX8's own limit for a manual run).
      # With automatic amounts, these are the most each zone gets.
      zones: >-
        {% set text = parts[1] if parts | length > 1 else '' %}
        {% set items = text.split(',') | select('match', 'valve\\.retic_[a-z0-9_]+:([1-9]|1[0-5])$') | list %}
        {% set ns = namespace(out=[], seen=[]) %}
        {% for item in (items or default_zones.split(',')) %}
          {% set bits = item.split(':') %}
          {% if bits[0] not in ns.seen %}
            {% set ns.seen = ns.seen + [bits[0]] %}
            {% set ns.out = ns.out + [{'entity': bits[0], 'minutes': bits[1] | int}] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
      every: >-
        {% set text = parts[2] if parts | length > 2 else '' %}
        {{ text | int if text is match('[1-7]$') else default_every }}
      auto: "{{ (parts[3] if parts | length > 3 else 'auto') != 'fixed' }}"
      # Skip when the grass is likely wet already, or about to be.
      skip_past_mm: 3
      skip_forecast_mm: 5
    sensor:
      - name: Retic next run
        unique_id: retic_next_run
        device_class: timestamp
        icon: mdi:calendar-clock
        # The last run that watered, or was skipped for rain, sets the next
        # one `every` days later. A run skipped for any other reason (no rain
        # data, switched off) tries again the next day. Today's run is kept
        # for a few minutes past its start, so the sensor doesn't move on
        # before the automation's time trigger fires.
        state: >
          {% set log = state_attr('sensor.retic_history', 'log') %}
          {% set entries = log if log is not string and log is iterable else [] %}
          {% set done = entries | selectattr('result', 'in', ['watered', 'stopped']) | list
             + entries | selectattr('result', 'eq', 'skipped') | selectattr('wet', 'defined') | selectattr('wet') | list %}
          {% set last = done | map(attribute='at') | map('as_datetime', none) | reject('none') | map('as_local') | max if done else none %}
          {% set ns = namespace(next=none) %}
          {% for day in range(0, 120) %}
            {% set at = today_at(start) + timedelta(days=day) %}
            {% if ns.next is none and at + timedelta(minutes=5) > now() and at.month not in off_months
                  and (last is none or (at.date() - last.date()).days >= every) %}
              {% set ns.next = at %}
            {% endif %}
          {% endfor %}
          {{ ns.next.isoformat() if ns.next else none }}
        attributes:
          start: "{{ start }}"
          zones: "{{ zones }}"
          every: "{{ every }}"
          auto: "{{ auto }}"
          skip_past_mm: "{{ skip_past_mm }}"
          skip_forecast_mm: "{{ skip_forecast_mm }}"

  # A log of the last 40 scheduled runs for the Cannvas history graph. The
  # recorder only keeps about 10 days, but a trigger-based template sensor
  # restores its attributes across restarts, so this outlives the recorder.
  # Each retic_schedule_result event adds an entry, or updates the last one
  # when it's the same run (started, then watered or stopped early).
  - triggers:
      - trigger: event
        event_type: retic_schedule_result
    sensor:
      - name: Retic history
        unique_id: retic_history
        icon: mdi:history
        state: "{{ trigger.event.data.at }}"
        attributes:
          log: >
            {% set old = this.attributes.log if this.attributes.log is defined and this.attributes.log is not string else [] %}
            {% set data = trigger.event.data %}
            {% set entry = {
              'at': data.at,
              'result': data.result,
              'reason': data.reason | default(none),
              'minutes': data.minutes | default(none),
              'rainBefore': data.rain_before | default(none),
              'rainAfter': data.rain_after | default(none),
              'wet': data.wet | default(false) in [true, 'true', 'True'],
            } %}
            {% if old and old[-1].at == entry.at %}
              {% set old = old[:-1] %}
            {% endif %}
            {{ (old + [entry])[-40:] }}

script:
  retic_run_zone:
    alias: Retic run zone
    description: >-
      Runs one retic zone for a set number of minutes, closing any other open
      zone first. If Home Assistant stops mid-run, the WX8 closes the zone by
      itself after its own 15-16 minute manual run time.
    icon: mdi:sprinkler-variant
    mode: restart
    fields:
      zone:
        name: Zone
        required: true
        selector:
          entity:
            domain: valve
            integration: tuya_local
      minutes:
        name: Minutes
        required: true
        default: 10
        selector:
          number:
            min: 1
            max: 15
            unit_of_measurement: min
    sequence:
      - variables:
          run_minutes: "{{ [[minutes | int(0), 1] | max, 15] | min }}"
          retic_valves: "{{ states.valve | selectattr('entity_id', 'match', 'valve\\.retic_') | rejectattr('entity_id', 'eq', zone) | list }}"
          others: "{{ retic_valves | selectattr('state', 'in', ['open', 'opening']) | map(attribute='entity_id') | list }}"
          # A zone in an unknown state might still be open, so don't start another.
          unknown_others: "{{ retic_valves | selectattr('state', 'in', ['unknown', 'unavailable']) | map(attribute='entity_id') | list }}"
      - condition: template
        value_template: >
          {{ is_state('input_boolean.retic_enabled', 'on')
             and zone is string and zone is match('valve\.retic_[a-z0-9_]+$')
             and states(zone) not in ['unknown', 'unavailable']
             and unknown_others | length == 0 }}
      - if:
          - condition: template
            value_template: "{{ others | length > 0 }}"
        then:
          - action: script.retic_close_all
          # Never water two zones at once.
          - condition: template
            value_template: "{{ expand(others) | selectattr('state', 'ne', 'closed') | list | length == 0 }}"
      - action: valve.open_valve
        target:
          entity_id: "{{ zone }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.retic_run_ends
        data:
          timestamp: "{{ now().timestamp() + run_minutes * 60 }}"
      - delay:
          minutes: "{{ run_minutes }}"
      - action: valve.close_valve
        target:
          entity_id: "{{ zone }}"
      # For sensor.retic_dryness. A run cut short doesn't count, so the zone
      # looks drier than it is and gets a little more next time.
      - event: retic_zone_watered
        event_data:
          zone: "{{ zone }}"
          minutes: "{{ run_minutes }}"

  retic_queue:
    alias: Retic queue
    description: >-
      Edits the zones queued by hand. add puts a zone at the end, or changes its
      minutes if it's already waiting. remove takes a waiting zone out. clear
      empties everything waiting. stop empties the lot, including the zone
      watering now. done takes the finished zone off the front. Only stop and
      done touch the zone watering now. Queued, so edits never overlap.
    icon: mdi:format-list-numbered
    mode: queued
    max: 30
    fields:
      action:
        description: add, remove, clear, stop or done.
        required: true
      zone:
        description: The zone's valve, for add, remove and done.
      minutes:
        description: How long to water it, for add.
    sequence:
      - variables:
          items: "{{ states('input_text.retic_queue').split(',') | select('match', 'valve\\.retic_[a-z0-9_]+:[0-9]+$') | list }}"
          running: "{{ is_state('script.retic_run_queue', 'on') }}"
          zone_id: "{{ zone | default('') }}"
          item: "{{ zone_id ~ ':' ~ (minutes | default(0) | int(0)) }}"
      - condition: template
        value_template: >
          {{ action in ['clear', 'stop']
             or (action in ['remove', 'done'] and zone_id is match('valve\.retic_[a-z0-9_]+$'))
             or (action == 'add' and zone_id is match('valve\.retic_[a-z0-9_]+$')
                 and (minutes | default(0) | int(0)) in range(1, 16)
                 and is_state('input_boolean.retic_enabled', 'on')) }}
      - variables:
          updated: >
            {% set ns = namespace(out=[], found=false) %}
            {% for entry in items %}
              {% set name = entry.split(':')[0] %}
              {% set watering = loop.first and running %}
              {% if action == 'stop' or (action == 'done' and loop.first and name == zone_id) %}
              {% elif action == 'clear' and not watering %}
              {% elif action == 'remove' and name == zone_id and not watering %}
              {% elif action == 'add' and name == zone_id %}
                {% set ns.found = true %}
                {% set ns.out = ns.out + [entry if watering else item] %}
              {% else %}
                {% set ns.out = ns.out + [entry] %}
              {% endif %}
            {% endfor %}
            {% if action == 'add' and not ns.found %}{% set ns.out = ns.out + [item] %}{% endif %}
            {{ ns.out | join(',') }}
      - action: input_text.set_value
        target:
          entity_id: input_text.retic_queue
        data:
          value: "{{ updated | trim }}"
      # The first zone queued starts straight away. Like any run by hand, it
      # replaces scheduled watering and cancels a Stop's close retries.
      - if:
          - condition: template
            value_template: "{{ action == 'add' and not running }}"
        then:
          - action: script.turn_off
            target:
              entity_id:
                - script.retic_run_schedule
                - script.retic_close_all
          - action: script.turn_on
            target:
              entity_id: script.retic_run_queue

  retic_run_queue:
    alias: Retic run queue
    description: >-
      Waters the queued zones one after another, taking each off the queue
      when it's done, until the queue is empty or the retic is switched off.
    icon: mdi:sprinkler-variant
    mode: single
    max_exceeded: silent
    sequence:
      - repeat:
          while:
            - condition: template
              # The limit only guards against a loop that never takes anything off.
              value_template: >
                {{ repeat.index <= 30 and is_state('input_boolean.retic_enabled', 'on')
                   and states('input_text.retic_queue') is match('valve\.') }}
          sequence:
            - variables:
                head: "{{ states('input_text.retic_queue').split(',')[0].split(':') }}"
            - action: script.retic_run_zone
              data:
                zone: "{{ head[0] }}"
                minutes: "{{ head[1] | int(0) }}"
            - action: script.retic_queue
              data:
                action: done
                zone: "{{ head[0] }}"

  retic_run_schedule:
    alias: Retic run schedule
    description: >-
      Runs each zone in the schedule in turn, then records how it went. A run
      cut short (switched off, Stop pressed, another zone started) never gets
      to the end, and the Retic schedule stopped automation records it instead.
    icon: mdi:sprinkler-variant
    mode: single
    fields:
      started:
        description: When the run started, as an ISO time. It identifies the run in the history log.
      when:
        description: The start time as shown in the last result, like "Wed 11 Nov, 6:00 AM".
      past:
        description: Rain in the 24 hours before, in mm.
      ahead:
        description: Rain forecast for the 12 hours after, in mm.
      zones:
        description: The zones to water in order, each {entity, minutes}. Leave out for the schedule's own minutes.
    sequence:
      - variables:
          plan: "{{ zones if zones is defined and zones is not string and zones is iterable else (state_attr('sensor.retic_next_run', 'zones') or []) }}"
          planned: "{{ plan | map(attribute='minutes') | map('int', 0) | sum }}"
          logged: "{{ started is defined and started is string and started != '' }}"
      # The schedule takes over from zones queued by hand, the way a run by
      # hand takes over from the schedule. Both running would fight over
      # retic_run_zone.
      - action: script.retic_queue
        data:
          action: stop
      - action: script.turn_off
        target:
          entity_id: script.retic_run_queue
      # Logged here rather than by the caller, so a call turned away because a
      # run is already going doesn't leave a "watering" entry nothing finishes.
      # Logged as watering first, so a run cut short by a restart still shows.
      - if:
          - condition: template
            value_template: "{{ logged }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.retic_last_result
            data:
              value: "Watering since {{ when }}"
          - event: retic_schedule_result
            event_data:
              at: "{{ started }}"
              result: watering
              rain_before: "{{ past }}"
              rain_after: "{{ ahead }}"
      - repeat:
          for_each: "{{ plan }}"
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.retic_enabled
                  state: "off"
              then:
                - stop: The retic was switched off
            - action: script.retic_run_zone
              data:
                zone: "{{ repeat.item.entity }}"
                minutes: "{{ repeat.item.minutes }}"
      - if:
          - condition: template
            value_template: "{{ logged }}"
        then:
          - variables:
              minutes: "{{ [((now() - as_datetime(started)).total_seconds() / 60) | round(0) | int, 0] | max }}"
              # retic_run_zone quietly gives up on a zone it can't read, so a run
              # that ended well short of its planned time didn't water everything.
              complete: "{{ minutes >= planned - 2 }}"
          # The log first: it's what Retic schedule stopped checks, so a run
          # cut off between these two steps is still recorded right.
          - event: retic_schedule_result
            event_data:
              at: "{{ started }}"
              result: "{{ 'watered' if complete else 'stopped' }}"
              minutes: "{{ minutes }}"
              rain_before: "{{ past }}"
              rain_after: "{{ ahead }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.retic_last_result
            data:
              value: "{{ ('Watered ' if complete else 'Stopped early ') ~ when }}"

  retic_close_all:
    alias: Retic close all
    description: >-
      Closes every open retic zone, retrying until they all report closed. Gives
      up after about 30 seconds if the controller can't be reached.
    icon: mdi:water-off
    mode: single
    sequence:
      - repeat:
          sequence:
            - variables:
                open: "{{ states.valve | selectattr('entity_id', 'match', 'valve\\.retic_') | rejectattr('state', 'eq', 'closed') | map(attribute='entity_id') | list }}"
            - if:
                - condition: template
                  value_template: "{{ open | length > 0 }}"
              then:
                - action: valve.close_valve
                  # An unreachable zone errors, which mustn't stop the retries.
                  continue_on_error: true
                  target:
                    entity_id: "{{ open }}"
                - delay:
                    seconds: 5
          # Unknown isn't closed, so keep going until every zone says closed.
          until:
            - condition: template
              value_template: >
                {{ repeat.index >= 6 or states.valve | selectattr('entity_id', 'match', 'valve\.retic_')
                   | rejectattr('state', 'eq', 'closed') | list | length == 0 }}

automation:
  - id: retic_scheduled_watering
    alias: Retic scheduled watering
    description: Waters on schedule unless the retic is off or the grass is likely wet.
    mode: single
    triggers:
      - trigger: time
        at: sensor.retic_next_run
    actions:
      - variables:
          when: "{{ now().strftime('%a %-d %b, %-I:%M %p') }}"
          started: "{{ now().isoformat() }}"
      # The weather refreshes every 30 minutes, so the rain windows could be
      # an hour behind. Refreshing now makes them end at this hour, the same
      # windows the Cannvas page predicts with. The refresh can return before
      # the new numbers arrive (a fetch already under way), so wait for them,
      # and fall back to the last good ones if Open-Meteo is slow or down.
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: sensor.retic_weather_fetch
      - wait_template: >
          {{ states.sensor.retic_weather is not none
             and states.sensor.retic_weather.last_changed >= as_datetime(started) }}
        timeout: "00:00:45"
        continue_on_timeout: true
      # Let the rain sensors take in the new numbers.
      - delay:
          seconds: 2
      - variables:
          past: "{{ states('sensor.retic_rain_last_24h') | float(none) }}"
          ahead: "{{ states('sensor.retic_rain_next_12h') | float(none) }}"
          past_limit: "{{ state_attr('sensor.retic_next_run', 'skip_past_mm') | float(3) }}"
          ahead_limit: "{{ state_attr('sensor.retic_next_run', 'skip_forecast_mm') | float(5) }}"
          auto: "{{ state_attr('sensor.retic_next_run', 'auto') in [true, 'true', 'True'] }}"
          # With automatic amounts, each zone gets what it's short (see
          # sensor.retic_dryness), up to its minutes in the schedule. A zone
          # needing under 3 minutes waits for next time.
          plan: >
            {% set short = state_attr('sensor.retic_dryness', 'short') %}
            {% set setup = state_attr('sensor.retic_dryness', 'setup') %}
            {% set ns = namespace(out=[]) %}
            {% for zone in state_attr('sensor.retic_next_run', 'zones') or [] %}
              {% if not auto %}
                {% set ns.out = ns.out + [zone] %}
              {% elif short is mapping and setup is mapping and zone.entity in short and zone.entity in setup %}
                {% set minutes = [(short[zone.entity] / setup[zone.entity].rate) | round(0, 'ceil') | int, zone.minutes] | min %}
                {% if minutes >= 3 %}{% set ns.out = ns.out + [{'entity': zone.entity, 'minutes': minutes}] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          # wet: skipped because the garden doesn't need it, so the next run is
          # the usual number of days away. Any other skip tries again tomorrow.
          skip: >
            {% if is_state('input_boolean.retic_enabled', 'off') %}{{ {'reason': 'the retic is switched off'} }}
            {% elif states.valve | selectattr('entity_id', 'match', 'valve\.retic_') | selectattr('state', 'in', ['unknown', 'unavailable']) | list %}{{ {'reason': "Home Assistant can't read every zone"} }}
            {% elif is_state('binary_sensor.retic_rain_sensor', 'on') %}{{ {'reason': 'the rain sensor is wet', 'wet': true} }}
            {# Fail closed: a missed watering is cheap, watering after heavy rain isn't,
               and the skip reason shows in Cannvas so a dead feed gets noticed. #}
            {% elif past is none or ahead is none %}{{ {'reason': "there's no rain data"} }}
            {% elif auto and states('sensor.retic_dryness') in ['unknown', 'unavailable'] %}{{ {'reason': "Home Assistant doesn't know how dry it is"} }}
            {% elif not auto and past >= past_limit %}{{ {'reason': past ~ ' mm of rain in the last 24 hours', 'wet': true} }}
            {% elif ahead >= ahead_limit %}{{ {'reason': ahead ~ ' mm of rain forecast in the next 12 hours', 'wet': true} }}
            {% elif plan | length == 0 %}{{ {'reason': "nothing's dry enough to need it", 'wet': true} }}
            {% else %}{{ {} }}
            {% endif %}
          reason: "{{ skip.reason | default('') }}"
      - if:
          - condition: template
            value_template: "{{ reason | trim != '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.retic_last_result
            data:
              value: "Skipped {{ when }}: {{ reason | trim }}"
          - event: retic_schedule_result
            event_data:
              at: "{{ started }}"
              result: skipped
              reason: "{{ reason | trim }}"
              wet: "{{ skip.wet | default(false) }}"
              rain_before: "{{ past }}"
              rain_after: "{{ ahead }}"
          - stop: Skipped
      - action: script.retic_run_schedule
        data:
          started: "{{ started }}"
          when: "{{ when }}"
          past: "{{ past }}"
          ahead: "{{ ahead }}"
          zones: "{{ plan }}"

  # A scheduled run that never reached the end of retic_run_schedule: switched
  # off, Stop pressed, another zone started, or Home Assistant restarted. Its
  # log entry still says watering. A run that finished has already logged
  # watered or stopped by the time the script goes off.
  - id: retic_schedule_stopped
    alias: Retic schedule stopped
    description: Records a scheduled run that was cut short.
    mode: queued
    triggers:
      - trigger: state
        entity_id: script.retic_run_schedule
        from: "on"
        to: "off"
        id: stopped
      - trigger: homeassistant
        event: start
        id: restarted
    actions:
      # Give the template sensor a moment to take in the script's last event.
      - delay:
          seconds: 3
      - variables:
          last: "{{ (state_attr('sensor.retic_history', 'log') or [none])[-1] }}"
          shown: "{{ as_timestamp(last.at) | timestamp_custom('%a %-d %b, %-I:%M %p') if last is mapping else '' }}"
      - condition: template
        value_template: "{{ last is mapping and not is_state('script.retic_run_schedule', 'on') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ last.result == 'watering' }}"
            sequence:
              - event: retic_schedule_result
                event_data:
                  at: "{{ last.at }}"
                  result: stopped
                  # After a restart the downtime would count, so leave it unknown.
                  minutes: >-
                    {{ [((now() - as_datetime(last.at)).total_seconds() / 60) | round(0) | int, 0] | max if trigger.id == 'stopped' else none }}
                  rain_before: "{{ last.rainBefore }}"
                  rain_after: "{{ last.rainAfter }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.retic_last_result
                data:
                  value: "Stopped early {{ shown }}"
          # The run logged its end but was cut off before updating the last
          # result, so bring the text in line with the log.
          - conditions:
              - condition: template
                value_template: >
                  {{ last.result in ['watered', 'stopped']
                     and states('input_text.retic_last_result').startswith('Watering since') }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.retic_last_result
                data:
                  value: "{{ ('Watered ' if last.result == 'watered' else 'Stopped early ') ~ shown }}"

  # The WX8 ignores a close that arrives within a second or two of a zone
  # opening, then reports it open again, so both of these keep closing until
  # every zone reports closed.
  - id: retic_switched_off
    alias: Retic switched off
    description: Stops everything when the master switch goes off.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.retic_enabled
        to: "off"
    actions:
      # Empty the queue first, so the runner has nothing to move on to.
      - action: script.retic_queue
        data:
          action: stop
      - action: script.turn_off
        target:
          entity_id:
            - script.retic_run_queue
            - script.retic_run_schedule
            - script.retic_run_zone
      - action: script.retic_close_all

  - id: retic_switched_on
    alias: Retic switched on
    description: Cancels any switch-off cleanup so it can't close a run started straight after.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.retic_enabled
        to: "on"
    actions:
      - action: script.turn_off
        target:
          entity_id: script.retic_close_all

  - id: retic_keep_closed_while_off
    alias: Retic keep closed while off
    description: Closes any zone opened on the controller or in Smart Life while the retic is switched off.
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - valve.retic_back_grass_right
          - valve.retic_back_grass_left
          - valve.retic_back_flower_beds
          - valve.retic_front_garden_beds
          - valve.retic_front_grass
          - valve.retic_zone_6
          - valve.retic_zone_7
          - valve.retic_zone_8
        to:
          - open
          - opening
        for:
          seconds: 3
    conditions:
      - condition: state
        entity_id: input_boolean.retic_enabled
        state: "off"
    actions:
      - action: script.retic_close_all
