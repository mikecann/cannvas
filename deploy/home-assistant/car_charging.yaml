# Car charging: the BYD's portable charger is plugged into a TP-Link HS110
# ("Car Charger", switch.car_charger) in the garage.
#
# The Solis inverter is export-limited to zero with no battery, so spare sun
# never shows up as export: the panels just throttle down to match the house.
# The only way to find out whether there's sun for the car is to forecast it,
# switch the charger on, and watch whether the grid has to step in.
#
# Modes (input_select.car_charging_mode, set from Cannvas):
#   solar - "Auto" on Cannvas (the default): charge on spare sun up to the
#           limit, charge anyway by day when below the daytime minimum, and
#           top up overnight when low
#   boost - charge regardless up to input_number.car_boost_target, then go
#           back to solar
#   off   - leave the plug off
#
# The car's battery % comes from the BYD Vehicle integration
# (sensor.byd_atto_3_battery_level, polled every 10 min through a second BYD
# account the car is shared with). With it, sun charging stops at a limit, and
# on a low evening the car is topped up overnight from the grid. All three
# numbers are set from the Cannvas car card. If the battery reading is missing,
# the rules carry on as if there were no limit.
#
# Source of truth is cannvas deploy/home-assistant/car_charging.yaml. Copy it to
# /config/packages on the HA Pi after edits (`ssh ha`), then reload automations,
# input helpers and template entities (or restart Home Assistant).

input_select:
  car_charging_mode:
    name: Car charging mode
    # No `initial`, so the mode survives a Home Assistant restart.
    options: [solar, boost, "off"]
    icon: mdi:car-electric

# No `initial` on these, so values set from Cannvas survive a restart. Their
# first values (80, 30, 50) were set once by hand after installing.
input_number:
  car_charge_limit:
    name: Car sun charging limit
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
  car_overnight_below:
    name: Car overnight top-up when below
    min: 0
    max: 90
    step: 5
    unit_of_measurement: "%"
    mode: box
  car_overnight_target:
    name: Car overnight top-up to
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
  # By day, below this the car charges whatever the sun is doing (so cloudy
  # days still keep it usable), up to this same %. Set from Cannvas, started at 50.
  car_day_minimum:
    name: Car daytime minimum
    min: 0
    max: 90
    step: 5
    unit_of_measurement: "%"
    mode: box
  # Picked on Cannvas each time Boost is pressed.
  car_boost_target:
    name: Car boost to
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box

input_boolean:
  # On while an overnight top-up is running, so the sun rules leave it alone.
  car_overnight_active:
    name: Car overnight top-up running
  # On while charging up to the daytime minimum, so the sun rules leave it alone.
  car_minimum_active:
    name: Car daytime minimum charge running

input_datetime:
  # After a pause for lack of sun, wait a while before trying again so a cloudy
  # day doesn't click the charger on and off every few minutes.
  car_charging_retry_after:
    name: Car charging retry after
    has_date: true
    has_time: true

input_text:
  # The last thing the controller decided, shown on Cannvas.
  car_charging_reason:
    name: Car charging reason
    max: 120

template:
  - binary_sensor:
      # On when the house (car included) has been pulling noticeably from the
      # grid for 5 minutes. The car draws ~1.7 kW, so 0.5 kW lets it ride
      # through a passing cloud without paying for most of the charge.
      - name: Car charging short of sun
        unique_id: car_charging_short_of_sun
        state: "{{ states('sensor.solis_grid_import_power') | float(0) > 0.5 }}"
        delay_on: "00:05:00"
    sensor:
      # How much more the panels could make right now than the house is using,
      # from Forecast.Solar's model. Only a hint: clouds can make it optimistic.
      - name: Car charging spare sun
        unique_id: car_charging_spare_sun
        unit_of_measurement: kW
        device_class: power
        state: >
          {% set possible = states('sensor.power_production_now') | float(0) / 1000 %}
          {% set house = states('sensor.solis_house_load_power') | float(0) %}
          {% set car = states('sensor.car_charger_current_consumption') | float(0) / 1000 %}
          {{ [possible - (house - car), 0] | max | round(2) }}

automation:
  - id: car_charging_mode_changed
    alias: "Car charging: mode changed"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_select.car_charging_mode
    actions:
      - choose:
          - conditions: "{{ trigger.to_state.state == 'boost' }}"
            sequence:
              - action: switch.turn_on
                target: { entity_id: switch.car_charger }
              - action: input_text.set_value
                target: { entity_id: input_text.car_charging_reason }
                data: { value: "Boosting to {{ states('input_number.car_boost_target') | int }}%" }
          - conditions: "{{ trigger.to_state.state == 'off' }}"
            sequence:
              - action: switch.turn_off
                target: { entity_id: switch.car_charger }
              # Only for a person switching it off. The over-current rule sets
              # its own reason, which this mustn't overwrite.
              - if: "{{ trigger.to_state.context.parent_id is none }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.car_charging_reason }
                    data: { value: "Switched off" }
        # solar: leave the plug as it is. If there isn't enough sun the stop
        # rule below turns it off; switching off here first would just click
        # the charger off and back on a couple of minutes later.
        default:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.car_charging_retry_after }
            data: { timestamp: "{{ now().timestamp() | int }}" }
          - action: input_text.set_value
            target: { entity_id: input_text.car_charging_reason }
            data: { value: "Waiting for spare sun" }

  - id: car_charging_solar_start
    alias: "Car charging: start on spare sun"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/2"
    conditions:
      - condition: state
        entity_id: input_select.car_charging_mode
        state: solar
      - condition: state
        entity_id: switch.car_charger
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: template
        value_template: >
          {{ now().timestamp() >= state_attr('input_datetime.car_charging_retry_after', 'timestamp') | float(0) }}
      # Room for the car's ~1.7 kW plus a margin.
      - condition: numeric_state
        entity_id: sensor.car_charging_spare_sun
        above: 2.0
      - condition: numeric_state
        entity_id: sensor.solis_grid_import_power
        below: 0.3
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "off"
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "off"
      # Under the limit, or no reading from the car.
      - condition: template
        value_template: >
          {% set battery = states('sensor.byd_atto_3_battery_level') %}
          {{ not is_number(battery) or battery | float < states('input_number.car_charge_limit') | float(100) }}
    actions:
      - action: switch.turn_on
        target: { entity_id: switch.car_charger }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data: { value: "Charging from spare sun" }

  - id: car_charging_solar_stop
    alias: "Car charging: stop when the sun can't cover it"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.car_charging_short_of_sun
        to: "on"
      - trigger: state
        entity_id: sun.sun
        to: below_horizon
      # Catches a switch to solar mode while already short of sun or after dark.
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_select.car_charging_mode
        state: solar
      - condition: state
        entity_id: switch.car_charger
        state: "on"
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "off"
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "off"
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.car_charging_short_of_sun
            state: "on"
          - condition: state
            entity_id: sun.sun
            state: below_horizon
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.car_charger }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.car_charging_retry_after }
        data: { timestamp: "{{ (now() + timedelta(minutes=20)).timestamp() | int }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data:
          value: >
            {{ 'Waiting for tomorrow\'s sun' if is_state('sun.sun', 'below_horizon')
               else 'Paused: not enough sun' }}

  - id: car_charging_reached_limit
    alias: "Car charging: stop at the sun charging limit"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.byd_atto_3_battery_level
      - trigger: state
        entity_id: input_number.car_charge_limit
    conditions:
      - condition: state
        entity_id: input_select.car_charging_mode
        state: solar
      - condition: state
        entity_id: switch.car_charger
        state: "on"
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "off"
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "off"
      - condition: template
        value_template: >
          {% set battery = states('sensor.byd_atto_3_battery_level') %}
          {{ is_number(battery) and battery | float >= states('input_number.car_charge_limit') | float(100) }}
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.car_charger }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data: { value: "Charged to {{ states('input_number.car_charge_limit') | int }}%" }

  # Cloudy-day safety net: by day, if the car is under the minimum, charge on
  # whatever sun there is plus the grid until it's back up to the minimum.
  - id: car_charging_minimum_start
    alias: "Car charging: charge anyway below the daytime minimum"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_number.car_day_minimum
    conditions:
      - condition: time
        after: "06:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: input_select.car_charging_mode
        state: solar
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "off"
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.byd_atto_3_plug
        state: "on"
      - condition: template
        value_template: >
          {% set battery = states('sensor.byd_atto_3_battery_level') %}
          {{ is_number(battery) and battery | float < states('input_number.car_day_minimum') | float(0) }}
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.car_minimum_active }
      - action: switch.turn_on
        target: { entity_id: switch.car_charger }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data: { value: "Under {{ states('input_number.car_day_minimum') | int }}%, so charging sun or not" }

  - id: car_charging_minimum_stop
    alias: "Car charging: daytime minimum reached"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.byd_atto_3_battery_level
      - trigger: state
        entity_id: input_number.car_day_minimum
      # Evening: the overnight rule takes over from here.
      - trigger: time
        at: "21:00:00"
        id: evening
      - trigger: state
        entity_id: input_select.car_charging_mode
        id: mode
    conditions:
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: [evening, mode]
          - condition: template
            value_template: >
              {% set battery = states('sensor.byd_atto_3_battery_level') %}
              {{ is_number(battery) and battery | float >= states('input_number.car_day_minimum') | float(0) }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.car_minimum_active }
      # Hand back to the sun rules: they keep it going if there's spare sun, or
      # switch it off within a few minutes if the grid is covering it.
      - if: "{{ trigger.id != 'mode' }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.car_charging_reason }
            data: { value: "Back over {{ states('input_number.car_day_minimum') | int }}%, waiting for spare sun" }

  # Checked every 10 minutes through the night, so plugging in late still counts.
  - id: car_charging_overnight_start
    alias: "Car charging: overnight top-up when low"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: time
        after: "21:00:00"
        before: "06:00:00"
      - condition: state
        entity_id: input_select.car_charging_mode
        state: solar
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "off"
      - condition: state
        entity_id: input_boolean.car_minimum_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.byd_atto_3_plug
        state: "on"
      - condition: template
        value_template: >
          {% set battery = states('sensor.byd_atto_3_battery_level') %}
          {{ is_number(battery)
             and battery | float < states('input_number.car_overnight_below') | float(0)
             and battery | float < states('input_number.car_overnight_target') | float(0) }}
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.car_overnight_active }
      - action: switch.turn_on
        target: { entity_id: switch.car_charger }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data: { value: "Topping up overnight to {{ states('input_number.car_overnight_target') | int }}%" }

  - id: car_charging_overnight_stop
    alias: "Car charging: overnight top-up done"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.byd_atto_3_battery_level
      - trigger: state
        entity_id: input_number.car_overnight_target
      # Morning: hand back to the sun rules, which start again if there's sun.
      - trigger: time
        at: "07:00:00"
        id: morning
      # Someone picked another mode while it was running.
      - trigger: state
        entity_id: input_select.car_charging_mode
        id: mode
    conditions:
      - condition: state
        entity_id: input_boolean.car_overnight_active
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: [morning, mode]
          - condition: template
            value_template: >
              {% set battery = states('sensor.byd_atto_3_battery_level') %}
              {{ is_number(battery) and battery | float >= states('input_number.car_overnight_target') | float(0) }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.car_overnight_active }
      # A mode change already set the plug the way it wants.
      - if: "{{ trigger.id != 'mode' }}"
        then:
          - action: switch.turn_off
            target: { entity_id: switch.car_charger }
          - action: input_text.set_value
            target: { entity_id: input_text.car_charging_reason }
            data:
              value: >
                {{ 'Waiting for spare sun' if trigger.id == 'morning'
                   else 'Topped up to ' ~ (states('input_number.car_overnight_target') | int) ~ '%' }}

  # Boost is for one charge: back to Auto once the car reaches the boost
  # target, or once it's been drawing nothing for a while (full, or unplugged).
  - id: car_charging_boost_finished
    alias: "Car charging: boost finished"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.byd_atto_3_battery_level
      - trigger: state
        entity_id: input_number.car_boost_target
      - trigger: numeric_state
        entity_id: sensor.car_charger_current_consumption
        below: 30
        for: "00:15:00"
      - trigger: state
        entity_id: input_select.car_charging_mode
        to: boost
        for: "00:15:00"
    conditions:
      - condition: state
        entity_id: input_select.car_charging_mode
        state: boost
      - condition: template
        value_template: >
          {% set battery = states('sensor.byd_atto_3_battery_level') %}
          {% set reached = is_number(battery) and battery | float >= states('input_number.car_boost_target') | float(100) %}
          {% set idle = states('sensor.car_charger_current_consumption') | float(0) < 30
             and (now() - states.input_select.car_charging_mode.last_changed).total_seconds() > 890 %}
          {{ reached or idle }}
    actions:
      # Switch off first so Auto starts from a clean slate and only turns it
      # back on if there's spare sun or the car is under a minimum.
      - action: switch.turn_off
        target: { entity_id: switch.car_charger }
      - action: input_select.select_option
        target: { entity_id: input_select.car_charging_mode }
        data: { option: solar }

  # The HS110 is a 10 A plug and the car normally draws about 7 A. Anything over
  # 9 A means something's wrong (or a different charger), so cut it.
  - id: car_charging_overcurrent
    alias: "Car charging: switch off over 9 A"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.car_charger_current
        above: 9
        for: "00:00:20"
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.car_charger }
      - action: input_select.select_option
        target: { entity_id: input_select.car_charging_mode }
        data: { option: "off" }
      - action: input_text.set_value
        target: { entity_id: input_text.car_charging_reason }
        data: { value: "Switched off: it drew over 9 A" }
      - action: notify.mobile_app_mikec
        data:
          title: Car charger switched off
          message: "The car charger plug drew {{ states('sensor.car_charger_current') }} A, over the 9 A limit for a 10 A plug."
      - action: persistent_notification.create
        data:
          title: Car charger switched off
          message: "The car charger plug drew {{ states('sensor.car_charger_current') }} A, over the 9 A limit for a 10 A plug."
