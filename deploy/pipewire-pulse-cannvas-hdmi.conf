# The Pi's vc4 HDMI device only accepts IEC958 frames. ALSA's hdmi plugin
# performs that conversion, while PipeWire's raw pro-audio profile does not.
pulse.cmd = [
  {
    cmd = "load-module"
    args = "module-alsa-sink device=hdmi:0 sink_name=cannvas_hdmi format=s16le rate=48000 channels=2 sink_properties=api.alsa.card=0"
    flags = [ ]
  }
]
