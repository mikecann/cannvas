## Cannvas "Hey Canvas" wakeword2 model (final/hey_canvas.onnx), 2026-10-12.
## The shipped deploy/wake-word/hey_canvas.onnx (run 3), fine-tuned on the owner's real voice through the CM108 mic.
##  init:  shipped model with its calibration removed (last_layer.bias + 3.698134 = logit(0.975829)), LOCAL PATCH 9
##  train: scripts/oww_train.py --train_model, steps 10000 (+1000 +1000 for train.py's sequences 2 and 3), base_lr 2e-5,
##         same negative-weight schedule (1 -> 1500) and checkpoint averaging as run 3
##  data:  run 3 synthetic features, regenerated with the README recipe and stock openWakeWord augmentation
##         (135k positives, 92.7k near-miss/adversarial negatives, ACAV100M 2000 h)
##         + positive_real (12/batch): the 10 close-range (0.5-1 m) session2 tries seg02 03 05 06 09 10 12 13 38 39,
##           1500 augmented 2 s windows each, cut from the continuous recording (scripts/real_aug.py)
##         + negative_owner (16/batch): 18 of the owner's own non-wake utterances (distance labels), 400 windows each,
##           and 6000 room-only windows (session1/2 silences, half with AudioSet/FMA mixed in)
##  calibration: last_layer.bias shifted by -logit(t), t = 0.157846 = the smallest raw threshold with no more hot
##         windows on validation_set_features (10.7 h) than the shipped model has at 0.5 (3 windows); the README's
##         first-half rule alone (--target-fph 0.4) gave t = 0.114044 (scripts/calib_matched.py)
##  sha256: see final/SHA256SUMS
