## openWakeWord train.py config for "hey canvas" (run 3).
## Same training settings as run 2 (layer 64, 100k steps, batch 1024/50/100); only the data changed.
## Run 2 caught 65/66 held-out positives but 15/87 held-out near misses fired (Kansas,
## "the canvas is ready"), while the same phrases from the training TTS were rejected: a
## voice-domain gap plus no negatives shaped like the continuation positives. Added:
##  - positives: + 25k "hey canvas" and 10k cut "hey canvas <command>" from Piper
##    en_GB-vctk-medium (109 UK speakers) -> 135k total (100k LibriTTS-R from run 2).
##  - negatives: + 11.9k LibriTTS-R and 4.8k VCTK "<near miss> <command>" cut 0-150 ms after the
##    near miss (configs/hard_prefixes.txt), + 8k VCTK custom near misses, + 8k VCTK adversarial
##    texts -> 92.7k total (60k from run 2).
## Features from run 2 + the new clips are concatenated and row-shuffled (scripts/merge_features.py).
## Test features (positive/negative_features_test.npy) are run 2's, so val numbers are comparable.
